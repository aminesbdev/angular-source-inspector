name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm test
      - name: Check that nothing ends up in production bundles
        run: npm run check:production
      - name: Check the package with Angular 21
        run: npm run check:angular-21
